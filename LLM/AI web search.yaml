
blueprint:
  name: "🚀 AI Web Search"
  author: "lone baggie"
  homeassistant:
    min_version: 2024.6.0
  description: |
    ## 🧠 Real-Time Web-Connected Voice AI

    This blueprint allows you to search the web using voice commands starting with **What**, **Where**, **Why**, **When**, **How**, or **Did**. The search results are summarized using AI Tasks.
    
    This enables lightweight local LLMs to answer general knowledge questions far more accurately by retrieving live context.
    
    *Note: Response quality depends on how clearly the question is phrased, the relevance of the web search snippets, and the underlying LLM's capabilities.*
    
    It queries the web using either a local **SearXNG** instance or the cloud-based **Brave Search API**. The retrieved information snippets are fed directly to your chosen AI Task pipeline to construct a concise response.

    ---

    ### ⚠️ Prerequisites & Requirements

    <details>
    <summary><b>👉 Click here to reveal the required configuration.yaml setup</b></summary>

    <br>

    You **MUST** define at least one of the following `rest_command:` blocks inside your `/config/configuration.yaml` file so Home Assistant can fetch live search results.

     ```yaml   
     rest_command:
       searxng_web_search:
         <rest of the code>
     ```
     or 
     
     ```yaml
     rest_command: !include rest_command.yaml
     ```
     
     
    #### Option A: Local SearXNG (Recommended)
    ```yaml
    searxng_web_search:   
      url: "[http://<YOUR IP HERE>:8080/search?q=](http://<YOUR IP HERE>:8080/search?q=){{ query | urlencode }}&format=json&categories=general&engines=google,duckduckgo,brave,wikipedia"
      method: GET    
      timeout: 6
      headers:
        Accept: "application/json"
        User-Agent: "HomeAssistant-Voice/1.0 (Linux x86_64; ESPHome-Pipeline)"

    ```

    #### Option B: Brave Search API
    ```yaml
    brave_web_search:
      url: "[https://api.search.brave.com/res/v1/web/search?q=](https://api.search.brave.com/res/v1/web/search?q=){{ query | urlencode }}&count=5&spellcheck=0&text_decorations=0"
      method: GET    
      timeout: 4
      headers:
        Accept: "application/json"
        Accept-Encoding: "gzip"
        X-Subscription-Token: "YOUR TOKEN HERE"
    ```

    > **Note:** Remember to reload your RESTful commands under **Developer Tools ➔ YAML ➔ RESTful Services** after saving!

    </details>

    ---

  domain: automation
  input:
    search_engine:
      name: "🔍 Search Engine Provider"
      description: "Select your search provider: your local, self-hosted SearXNG Docker container or the Brave Search cloud API."
      default: "searxng"
      selector:
        select:
          options:
            - label: "📦 SearXNG (Local Docker Container)"
              value: "searxng"
            - label: "🌐 Brave Search (Cloud API)"
              value: "brave"

    ai_task_entity:
      name: "🤖 AI Task Entity"
      description: "Select the AI Task pipeline entity responsible for processing and summarizing the search snippets."
      selector:
        entity:
          filter:
            domain: ai_task

mode: single

# Global variables defined before actions for correct scoping
variables:
  search_engine_choice: !input search_engine

trigger:
  - platform: conversation
    command:
      - "what {query}"
      - "What's {query}"
      - "whats {query}"
      - "where {query}"
      - "how {query}"
      - "who {query}"
      - "why {query}"
      - "when {query}"
      - "did {query}"

condition: []

action:
  # Step 1: Call the selected search engine REST command using trigger.sentence
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ search_engine_choice == 'brave' }}"
        sequence:
          - action: rest_command.brave_web_search
            data:
              query: "{{ trigger.sentence }}"
            response_variable: raw_search_results

    default:
      - action: rest_command.searxng_web_search
        data:
          query: "{{ trigger.sentence }}"
        response_variable: raw_search_results

  # Step 2: Use Jinja2 to feed search data, current time/date, and home location to your LLM
  - action: ai_task.generate_data
    data:
      entity_id: !input ai_task_entity
      task_name: "Voice Search Summarization"
      instructions: >-
        You are a smart home voice assistant. Summarize the live web search results 
        to answer the user's question directly. Keep your response very brief, clear, and conversational 
        (1 to 2 short sentences max). Do not use Markdown, bullet points, or special characters.

        ### System Environment Context:
        - Current Date & Time: {{ now().strftime('%A, %B %d, %Y at %I:%M %p') }}
        - Timezone: {{ now().tzinfo }}
        - Home Location: {{ state_attr('zone.home', 'friendly_name') | default('Home') }}
        - Coordinates: Latitude {{ state_attr('zone.home', 'latitude') }}, Longitude {{ state_attr('zone.home', 'longitude') }}

        ### User Question:
        {{ trigger.sentence }}

        ### Search Context:
        {% if raw_search_results is defined and raw_search_results.status == 200 %}
          {% if search_engine_choice == 'brave' %}
            {% set results = raw_search_results.content.web.results %}
            {% if results is defined and results | length > 0 %}
              {% for result in results %}
                ---
                Title: {{ result.title }}
                Snippet: {{ result.description }}
              {% endfor %}
            {% else %}
              No results returned from Brave Search.
            {% endif %}
          {% else %}
            {% set results = raw_search_results.content.results %}
            {% if results is defined and results | length > 0 %}
              {% for result in results[:5] %}
                ---
                Title: {{ result.title }}
                Snippet: {{ result.content }}
              {% endfor %}
            {% else %}
              No results returned from SearXNG.
            {% endif %}
          {% endif %}
        {% else %}
          The search query failed to fetch remote results.
        {% endif %}
    response_variable: ai_summary_output

  # Step 3: Speak back the result
  - set_conversation_response: "{{ ai_summary_output.data }}"
blueprint:
  name: AVA Voice Control for Music Assistant 
  author: Lonebaggie 
  homeassistant:
    min_version: 2024.6.0
  description: >
    ### 🗣 AVA Voice Control for Music Assistant
    
    Control Music Assistant via AVA voice satellites. Automatically routes commands to the 
    media player sharing the satellite's device name, with fallback to a default speaker or 
    an optional remote speaker override.
    
    <br>
    
    <details>
      <summary><b>ℹ️ Click to view Voice Command Syntax Guide</b></summary>
      <br>
      When adjusting phrases below, use this syntax:
      
      * <b>[Square Brackets]</b> = Optional text (e.g., <code>[the]</code>).
      * <b>(Parentheses | with | pipes)</b> = OR options (e.g., <code>(play|shuffle)</code>).
      * <b>{Curly Braces}</b> = Extraction slots. <b>Do not change the slot names!</b>
    </details>
  domain: automation

  input:
    # --- Speaker Configuration ---
    default_speaker_options:
      name: Speaker Settings
      icon: mdi:speaker
      collapsed: false
      input:
        default_speaker:
          name: Default Speaker
          description: The speaker to use if the satellite has no matching local media player.
          selector:
            entity:
              filter:
                - domain: media_player
        remote_speaker:
          name: Remote Speaker
          description: Target speaker when saying "on remote speaker". Leave blank if unused.
          default: ""
          selector:
            entity:
              filter:
                - domain: media_player
        volume_step:
          name: Volume Step Percentage
          description: Percentage amount to step volume up or down.
          default: 5
          selector:
            number:
              min: 1
              max: 50
              step: 1
              unit_of_measurement: "%"

    # --- Artist Section ---
    artist_options:
      name: Artist Voice Commands
      icon: mdi:account-music
      collapsed: true
      input:
        artist_sentence:
          name: Artist Command Phrase
          description: Single master pattern for playing or shuffling an artist.
          default: "(play|listen to|put on|stream|shuffle|randomise) [the ](artist|band|group|musician) {artist} [on remote speaker]"
          selector:
            text:

    # --- Song Section ---
    track_options:
      name: Song Voice Commands
      icon: mdi:music-note
      collapsed: true
      input:
        track_sentence:
          name: Track Command Phrase
          description: Single master pattern for playing or shuffling a specific song.
          default: "(play|listen to|put on|stream|shuffle|randomise) [the ](song|track|tune) {track}[ [by ][the ](artist|band|group|musician) {artist}] [on remote speaker]"
          selector:
            text:

    # --- Playlist Section ---
    playlist_options:
      name: Playlist Voice Commands
      icon: mdi:playlist-music
      collapsed: true
      input:
        playlist_sentence:
          name: Playlist Command Phrase
          description: Single master pattern for playing or shuffling a playlist.
          default: "(play|listen to|put on|stream|shuffle|randomise) [the ](playlist) {playlist} [on remote speaker]"
          selector:
            text:

    # --- Album Section ---
    album_options:
      name: Album Voice Commands
      icon: mdi:album
      collapsed: true
      input:
        album_sentence:
          name: Album Command Phrase
          description: Single master pattern for playing or shuffling an album.
          default: "(play|listen to|put on|stream|shuffle|randomise) [the ](album|ep|record|compilation) {album}[ [by ][the ](artist|band|group) {artist}] [on remote speaker]"
          selector:
            text:

    # --- Radio Section ---
    radio_options:
      name: Radio Voice Commands
      icon: mdi:radio
      collapsed: true
      input:
        radio_sentence:
          name: Radio Command Phrase
          description: Master pattern for tuning into radio stations.
          default: "(play|listen to|put on|turn on|stream) [the ](radio|BBC|station|radio station) {radio} [on remote speaker]"
          selector:
            text:

    # --- Audio Controls Section ---
    audio_controls:
      name: System Controls (Playback, Volume & Stop)
      icon: mdi:volume-high
      collapsed: true
      input:
        next_sentence:
          name: Next Track Phrase
          default: "(next track|next song|skip|skip track|skip song) [on remote speaker]"
          selector:
            text:
        previous_sentence:
          name: Previous Track Phrase
          default: "(previous track|previous song|back|go back) [on remote speaker]"
          selector:
            text:
        volume_up_sentence:
          name: Volume Up Phrase
          default: "(louder|turn it up|crank it up|raise the volume|volume up) [on remote speaker]"
          selector:
            text:
        volume_down_sentence:
          name: Volume Down Phrase
          default: "(quieter|turn it down|lower the volume|volume down) [on remote speaker]"
          selector:
            text:
        volume_set_sentence:
          name: Set Absolute Volume Phrase
          default: "(set|change|turn) [the ]volume [to ]{volume}[ percent| %] [on remote speaker]"
          selector:
            text:
        stop_sentence:
          name: Stop Music Phrase
          default: "(stop|cancel|pause|hush|shut up) [the ](music|audio|radio|playback) [on remote speaker]"
          selector:
            text:
        play_sentence:
          name: Resume / Play Music Phrase
          default: "(play|start|begin|resume) [the ](music|audio|radio|playback) [on remote speaker]"
          selector:
            text:

mode: single

trigger:
  - trigger: conversation
    command: !input artist_sentence
    id: artist
  - trigger: conversation
    command: !input track_sentence
    id: track
  - trigger: conversation
    command: !input playlist_sentence
    id: playlist
  - trigger: conversation
    command: !input album_sentence
    id: album
  - trigger: conversation
    command: !input radio_sentence
    id: radio
  - trigger: conversation
    command: !input next_sentence
    id: media_next
  - trigger: conversation
    command: !input previous_sentence
    id: media_previous
  - trigger: conversation
    command: !input volume_up_sentence
    id: volume_up
  - trigger: conversation
    command: !input volume_down_sentence
    id: volume_down
  - trigger: conversation
    command: !input volume_set_sentence
    id: volume_set
  - trigger: conversation
    command: !input stop_sentence
    id: media_stop
  - trigger: conversation
    command: !input play_sentence
    id: media_play

condition: []

action:
  # --- Phase 1: Determine Target Speaker & Resolve Remote Overrides ---
  - variables:
      vol_step_input: !input volume_step
      default: !input default_speaker
      remote: !input remote_speaker
      spoken_sentence: "{{ trigger.sentence | default('', true) | lower }}"
      
      # Extract satellite entity ID
      sat: "{{ trigger.satellite_id.split('.') if trigger.satellite_id is defined and trigger.satellite_id is not none and '.' in trigger.satellite_id else ['', ''] }}"
      raw_satellite_player: "{{ 'media_player.' ~ sat[1] if sat[1] != '' else '' }}"
      
      # Evaluate local satellite speaker vs default speaker
      base_speaker: >
        {% if raw_satellite_player != '' and states(raw_satellite_player) not in ['unknown', 'unavailable'] %}
          {{ raw_satellite_player }}
        {% else %}
          {{ default }}
        {% endif %}

      # Decide active target speaker
      speaker: >
        {% if 'on remote speaker' in spoken_sentence and remote is defined and remote | length > 0 %}
          {{ remote }}
        {% else %}
          {{ base_speaker }}
        {% endif %}

      # Guard Clause Evaluation
      no_remote_configured: >
        {% set explicit_remote = 'on remote speaker' in spoken_sentence %}
        {{ explicit_remote and (remote is not defined or remote | length == 0) }}

      remote_unavailable: >
        {% set explicit_remote = 'on remote speaker' in spoken_sentence %}
        {{ explicit_remote and remote is defined and remote | length > 0 and states(remote) in ['unavailable', 'unknown', 'off'] }}

  # --- Phase 2: Guard Clause Check Blocks ---
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ no_remote_configured }}"
        sequence:
          - set_conversation_response: "No remote speaker setup."
          - stop: "No remote speaker configured"

      - conditions:
          - condition: template
            value_template: "{{ remote_unavailable }}"
        sequence:
          - set_conversation_response: "Remote speaker not ready."
          - stop: "Remote speaker unavailable"

  # --- Phase 3: Extract Intent Slots & Compute Parameters ---
  - variables:
      calculated_step: "{{ (vol_step_input | default(5, true) | int) / 100 }}"
      radio: "{{ trigger.slots.radio | default('') }}"
      artist: "{{ trigger.slots.artist | default('') }}"
      album: "{{ trigger.slots.album | default('') }}"
      playlist: "{{ trigger.slots.playlist | default('') }}"
      track: "{{ trigger.slots.track | default('') }}"
      
      # Extract & clamp absolute volume (0.0 - 1.0)
      raw_volume: "{{ trigger.slots.volume | default('30') }}"
      target_absolute_volume: >-
        {% set parsed_vol = raw_volume | float(30.0) %}
        {% set clamped_vol = [ [parsed_vol, 0.0] | max, 100.0 ] | min %}
        {{ (clamped_vol / 100.0) | round(2) }}

      media_type: "{{ trigger.id.split('_') | first }}"
      
      # Determine transport action
      action: >-
        {% if trigger.id == 'media_stop' %}
          media_player.media_stop
        {% elif trigger.id == 'media_play' %}
          media_player.media_play
        {% elif trigger.id == 'media_next' %}
          media_player.media_next_track
        {% elif trigger.id == 'media_previous' %}
          media_player.media_previous_track
        {% else %}
          media_player.{{ media_type }}
        {% endif %}

      media_id: "{{ radio }} {{ artist }} {{ album }} {{ playlist }} {{ track }}"
      shuffle: "{{ 'shuffle' in spoken_sentence or 'random' in spoken_sentence }}"

      # Calculate relative volume shifts
      current_volume: "{{ state_attr(speaker, 'volume_level') | float(0.3) }}"
      target_volume: >-
        {% if trigger.id == 'volume_up' %}
          {{ ([current_volume + calculated_step, 1.0] | min) | round(2) }}
        {% elif trigger.id == 'volume_down' %}
          {{ ([current_volume - calculated_step, 0.0] | max) | round(2) }}
        {% else %}
          {{ current_volume }}
        {% endif %}

  # --- Phase 4: Execute Media Commands ---
  - choose:
      # Relative Volume Adjustment
      - conditions:
          - condition: template
            value_template: "{{ trigger.id in ['volume_up', 'volume_down'] }}"
        sequence:
          - action: media_player.volume_set
            target:
              entity_id: "{{ speaker }}"
            data:
              volume_level: "{{ target_volume }}"

      # Absolute Volume Setting
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'volume_set' }}"
        sequence:
          - action: media_player.volume_set
            target:
              entity_id: "{{ speaker }}"
            data:
              volume_level: "{{ target_absolute_volume }}"

      # Transport Controls (Stop, Play, Next, Previous)
      - conditions:
          - condition: template
            value_template: "{{ trigger.id in ['media_stop', 'media_play', 'media_next', 'media_previous'] }}"
        sequence:
          - action: "{{ action }}"
            target:
              entity_id: "{{ speaker }}"
            data: {}

      # Music Assistant Query Routing
      - conditions:
          - condition: template
            value_template: "{{ trigger.id in ['artist', 'track', 'album', 'radio', 'playlist'] }}"
        sequence:
          - action: media_player.shuffle_set
            target:
              entity_id: "{{ speaker }}"
            data:
              shuffle: "{{ shuffle }}"
          - action: music_assistant.play_media
            target:
              entity_id: "{{ speaker }}"
            data:
              media_id: "{{ media_id | trim }}"
              artist: "{{ artist }}"
              album: "{{ album }}"
              enqueue: play
              media_type: "{{ media_type }}"